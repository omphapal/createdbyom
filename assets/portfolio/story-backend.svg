<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" fill="none">
  <defs>
    <linearGradient id="p1-bg" x1="0" y1="0" x2="900" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#140f24"/>
      <stop offset="0.6" stop-color="#1e1533"/>
      <stop offset="1" stop-color="#2a1b47"/>
    </linearGradient>
    <radialGradient id="p1-glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#7a27f8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7a27f8" stop-opacity="0"/>
    </radialGradient>
    <filter id="p1-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="900" height="600" rx="16" fill="url(#p1-bg)"/>
  <rect width="900" height="600" rx="16" fill="url(#p1-glow)"/>

  <!-- Grid Pattern -->
  <g opacity="0.12" stroke="#ede1fd" stroke-width="1">
    <path d="M0 100H900M0 200H900M0 300H900M0 400H900M0 500H900"/>
    <path d="M150 0V600M300 0V600M450 0V600M600 0V600M750 0V600"/>
  </g>

  <!-- Connectors -->
  <path d="M220 300 H400 M500 300 H680 M450 210 V260 M450 340 V410" stroke="#a77bf3" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.6"/>

  <!-- Central Server Node -->
  <g transform="translate(390, 240)">
    <rect width="120" height="120" rx="18" fill="#24193d" stroke="#bda5f7" stroke-width="2" filter="url(#p1-blur)" opacity="0.3"/>
    <rect width="120" height="120" rx="18" fill="#22173a" stroke="#bda5f7" stroke-width="1.8"/>
    <circle cx="60" cy="50" r="22" fill="#7a27f8" fill-opacity="0.25" stroke="#d5bfff" stroke-width="1.5"/>
    <path d="M52 50L58 56L68 44" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="94" fill="#ede1fd" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">SPRING BOOT</text>
  </g>

  <!-- Left Ingress / REST Node -->
  <g transform="translate(130, 255)">
    <rect width="110" height="90" rx="14" fill="#1b122e" stroke="#8d66df" stroke-width="1.5"/>
    <text x="55" y="42" fill="#d9c6ff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">API GATEWAY</text>
    <text x="55" y="64" fill="#9d92b8" font-family="monospace" font-size="11" text-anchor="middle">REST / JSON</text>
  </g>

  <!-- Right DB Node -->
  <g transform="translate(660, 255)">
    <rect width="110" height="90" rx="14" fill="#1b122e" stroke="#8d66df" stroke-width="1.5"/>
    <text x="55" y="42" fill="#d9c6ff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">PERSISTENCE</text>
    <text x="55" y="64" fill="#9d92b8" font-family="monospace" font-size="11" text-anchor="middle">SQL / ACID</text>
  </g>

  <!-- Top Security Node -->
  <g transform="translate(395, 130)">
    <rect width="110" height="75" rx="12" fill="#1b122e" stroke="#7a44c9" stroke-width="1.5"/>
    <text x="55" y="38" fill="#e8dcfc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">AUTH &amp; JWT</text>
    <text x="55" y="58" fill="#a493c4" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">SPRING SECURITY</text>
  </g>

  <!-- Bottom Event Cache Node -->
  <g transform="translate(395, 410)">
    <rect width="110" height="75" rx="12" fill="#1b122e" stroke="#7a44c9" stroke-width="1.5"/>
    <text x="55" y="38" fill="#e8dcfc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">CACHE &amp; QUEUE</text>
    <text x="55" y="58" fill="#a493c4" font-family="monospace" font-size="10" text-anchor="middle">REDIS / STREAMS</text>
  </g>

  <!-- Status badges -->
  <rect x="50" y="50" width="130" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
  <circle cx="68" cy="66" r="4" fill="#4ade80"/>
  <text x="80" y="71" fill="#ede1fd" font-family="system-ui, sans-serif" font-size="11" font-weight="500">200 OK • 99.9%</text>
</svg>