<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" fill="none">
  <defs>
    <linearGradient id="p3-bg" x1="0" y1="0" x2="900" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#130d24"/>
      <stop offset="0.6" stop-color="#1f1438"/>
      <stop offset="1" stop-color="#2a184a"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" rx="16" fill="url(#p3-bg)"/>

  <!-- Workflow Stages -->
  <g transform="translate(80, 160)">
    <!-- Flow Connector -->
    <path d="M80 140 H660" stroke="#7946cf" stroke-width="3" stroke-dasharray="8 8"/>

    <!-- Step 1 -->
    <g transform="translate(0, 70)">
      <rect width="180" height="140" rx="14" fill="#1d1433" stroke="#6f42bf" stroke-width="1.5"/>
      <rect x="20" y="20" width="36" height="36" rx="8" fill="#7a27f8" fill-opacity="0.25"/>
      <text x="38" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">01</text>
      <text x="20" y="86" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Event Ingestion</text>
      <text x="20" y="110" fill="#a493c4" font-family="system-ui, sans-serif" font-size="12">Webhook &amp; REST trigger</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(280, 70)">
      <rect width="180" height="140" rx="14" fill="#1d1433" stroke="#8d5be8" stroke-width="1.8"/>
      <rect x="20" y="20" width="36" height="36" rx="8" fill="#9d6ef7" fill-opacity="0.25"/>
      <text x="38" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">02</text>
      <text x="20" y="86" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Validation &amp; Logic</text>
      <text x="20" y="110" fill="#a493c4" font-family="system-ui, sans-serif" font-size="12">Schema checks &amp; rules</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(560, 70)">
      <rect width="180" height="140" rx="14" fill="#1d1433" stroke="#6f42bf" stroke-width="1.5"/>
      <rect x="20" y="20" width="36" height="36" rx="8" fill="#7a27f8" fill-opacity="0.25"/>
      <text x="38" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">03</text>
      <text x="20" y="86" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Dispatch &amp; Sync</text>
      <text x="20" y="110" fill="#a493c4" font-family="system-ui, sans-serif" font-size="12">Database &amp; notifications</text>
    </g>
  </g>
</svg>